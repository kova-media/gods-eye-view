name: Sync upstream God's Eye View

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream source
        run: git clone --depth 1 https://github.com/bilawalsidhu/gods-eye-view.git /tmp/gods-eye-view-upstream

      - name: Copy the complete project into this repository
        shell: bash
        run: |
          cp -a .github/workflows /tmp/repo-workflows
          # Keep this repository's workflows: the GitHub App token cannot add
          # or remove workflow files without the separate Workflows permission.
          rm -rf /tmp/gods-eye-view-upstream/.github/workflows
          rsync -a --delete --exclude='.git/' --exclude='/api/cctv/' --exclude='/src/ui/styles/user-friendly.css' --exclude='/style.css' /tmp/gods-eye-view-upstream/ ./
          rm -rf .github/workflows
          cp -a /tmp/repo-workflows .github/workflows
          git add --all
          if git diff --cached --quiet; then
            echo "Repository already matches upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror upstream God's Eye View source"
          git push origin HEAD:main
